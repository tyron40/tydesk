# Free test deployment: filesystem and saved device pairings can reset.
services:
  - type: web
    name: tydesk-broker
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements-server.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: TYDESK_PASSWORD
        sync: false
      - key: TYDESK_HOST
        value: 0.0.0.0
      - key: TYDESK_DATA
        value: /tmp/tydesk
      - key: PYTHON_VERSION
        value: 3.12.12
