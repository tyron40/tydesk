# This configuration uses PAID compute and disk. Review Render's current quote before applying.
services:
  - type: web
    name: tydesk-broker
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements-server.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: TYDESK_PASSWORD
        sync: false
      - key: TYDESK_HOST
        value: 0.0.0.0
      - key: TYDESK_DATA
        value: /var/data/tydesk
      - key: PYTHON_VERSION
        value: 3.12.12
    disk:
      name: tydesk-data
      mountPath: /var/data
      sizeGB: 1
