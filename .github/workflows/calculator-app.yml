name: Build and test System Calculator on Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - calculator/**
      - .github/workflows/calculator-app.yml
permissions:
  contents: write
concurrency:
  group: system-calculator
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: |
            calculator
            downloads
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build standalone Windows app with runtime included
        shell: pwsh
        run: |
          dotnet publish calculator/SystemCalculator.csproj -c Release -o calculator-dist
          if ($LASTEXITCODE -ne 0) { throw 'Calculator publish failed' }
          if ((Get-Item 'calculator-dist/System Calculator.exe').Length -gt 95MB) { throw 'Executable exceeds repository size limit' }
      - name: Test downloaded executable on Windows
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          $testSource = (Resolve-Path "calculator/WindowsSmoke.cs").Path
          & $compiler /nologo /target:exe /out:CalculatorSmoke.exe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll $testSource
          if ($LASTEXITCODE -ne 0) { throw 'Smoke test driver did not compile' }
          & .\CalculatorSmoke.exe 'calculator-dist/System Calculator.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Windows calculator interaction tests failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calculator-windows-test
          path: |
            calculator-windows-smoke.json
            calculator-startup-error.log
      - name: Publish tested download
        shell: pwsh
        run: |
          Copy-Item 'calculator-dist/System Calculator.exe' 'downloads/System Calculator.exe' -Force
          @{version='2.0';architecture='windows-x64';self_contained=$true;windows_smoke_test=$true;source_commit=(git rev-parse HEAD)} | ConvertTo-Json | Set-Content downloads/system-calculator-build.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'downloads/System Calculator.exe' downloads/system-calculator-build.json
          git commit -m 'Publish Windows-tested standalone System Calculator 2.0'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit calculator build' }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize calculator build' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish calculator build' }
      - name: Verify exact website download opens as desktop calculator
        shell: pwsh
        run: |
          $ready = $false
          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            try {
              $info = Invoke-RestMethod 'https://zdesk-nnym.onrender.com/api/downloads?v=2.0'
              $calculator = $info.platforms | Where-Object { $_.id -eq 'system-calculator' }
              if ($calculator.version -eq '2.0') { $ready = $true; break }
            } catch { Write-Host 'Waiting for website deployment' }
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { throw 'Website did not deploy calculator version 2.0' }
          New-Item -ItemType Directory -Force website-check | Out-Null
          Invoke-WebRequest 'https://zdesk-nnym.onrender.com/download/system-calculator?v=2.0' -OutFile 'website-check/System Calculator.exe'
          & .\CalculatorSmoke.exe 'website-check/System Calculator.exe' --launch-only
          if ($LASTEXITCODE -ne 0) { throw 'Actual website download did not open correctly' }
          & .\CalculatorSmoke.exe 'website-check/System Calculator.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Website download password unlock or hide/restore test failed' }

