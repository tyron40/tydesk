name: Build Mac and Linux companions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - agent.py
      - desktop_runtime.py
      - desktop_shell.py
      - desktop_probe.py
      - native_shell.py
      - local_settings.py
      - remote_input.py
      - camera_capture.py
      - audio_capture.py
      - file_exchange.py
      - requirements.txt
      - download_catalog.py
      - tools/build_desktop.py
      - .github/workflows/desktop-apps.yml
permissions:
  contents: read
concurrency:
  group: desktop-companions
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-intel
            runner: macos-15-intel
            filename: ZDesk-macOS-Intel.zip
          - target: macos-arm64
            runner: macos-15
            filename: ZDesk-macOS-Apple-Silicon.zip
          - target: linux-x64
            runner: ubuntu-22.04
            filename: ZDesk-Linux-x64.tar.gz
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            filename: ZDesk-Linux-ARM64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Linux build and desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y python3-tk libpulse0 xvfb xauth libx11-6 libxtst6
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Check desktop behavior
        run: python -m unittest -q test_desktop.py
      - name: Build and smoke-test Mac bundle
        if: runner.os == 'macOS'
        run: python tools/build_desktop.py ${{ matrix.target }}
      - name: Build and smoke-test Linux bundle
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/build_desktop.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            downloads/${{ matrix.filename }}
            downloads/${{ matrix.target }}-build.json
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v5
        with:
          pattern: '*'
          path: native-bundles
          merge-multiple: true
      - name: Publish checked native companions
        run: |
          cp native-bundles/ZDesk-* downloads/
          cp native-bundles/*-build.json downloads/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/ZDesk-macOS-*.zip downloads/ZDesk-Linux-*.tar.gz downloads/macos-*-build.json downloads/linux-*-build.json
          git commit -m 'Publish checked Mac and Linux companion downloads'
          git pull --rebase origin main
          git push origin HEAD:main
